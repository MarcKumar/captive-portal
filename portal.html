<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KumarNet Gast - Anmeldung</title>
    <style>
        :root {
            --color-primary: #3B82F6;
            --color-primary-hover: #2563EB;
            --color-primary-glow: rgba(59, 130, 246, 0.4);
            --color-bg-dark: #0F172A;
            --color-bg-light: #1E293B;
            --color-card: rgba(255, 255, 255, 0.08);
            --color-card-border: rgba(255, 255, 255, 0.12);
            --color-text: #F1F5F9;
            --color-text-muted: #94A3B8;
            --color-border: rgba(148, 163, 184, 0.25);
            --color-input-bg: rgba(15, 23, 42, 0.5);
            --color-input-focus: #3B82F6;
            --color-error: #F87171;
            --color-error-bg: rgba(248, 113, 113, 0.1);
            --color-error-border: rgba(248, 113, 113, 0.3);
            --color-success: #4ADE80;
            --color-success-bg: rgba(74, 222, 128, 0.1);
            --color-success-border: rgba(74, 222, 128, 0.3);
            --card-max-width: 420px;
            --card-radius: 16px;
            --input-radius: 10px;
        }

        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(135deg, var(--color-bg-dark) 0%, var(--color-bg-light) 50%, var(--color-bg-dark) 100%);
            color: var(--color-text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
            line-height: 1.5;
            overflow: hidden;
            position: relative;
        }

        /* ---- Network Canvas Background ---- */
        #network-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        /* ---- Card ---- */
        .card {
            background: var(--color-card);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--color-card-border);
            border-radius: var(--card-radius);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3), 0 0 80px rgba(59, 130, 246, 0.05);
            width: 100%;
            max-width: var(--card-max-width);
            padding: 2.5rem 2rem;
            position: relative;
            z-index: 1;
            animation: card-enter 0.6s ease-out both;
        }

        @keyframes card-enter {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ---- Logo ---- */
        .logo {
            display: flex;
            justify-content: center;
            margin-bottom: 1.5rem;
        }

        .logo-wrap {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .logo-wrap::before {
            content: "";
            position: absolute;
            width: 76px;
            height: 76px;
            border-radius: 50%;
            border: 2px solid rgba(59, 130, 246, 0.3);
            animation: pulse-glow 3s ease-in-out infinite;
        }

        .logo svg {
            width: 56px;
            height: 56px;
            color: var(--color-primary);
            filter: drop-shadow(0 0 8px var(--color-primary-glow));
        }

        @keyframes pulse-glow {
            0%, 100% {
                transform: scale(1);
                border-color: rgba(59, 130, 246, 0.3);
                box-shadow: 0 0 0 0 rgba(59, 130, 246, 0);
            }
            50% {
                transform: scale(1.08);
                border-color: rgba(59, 130, 246, 0.5);
                box-shadow: 0 0 20px 4px rgba(59, 130, 246, 0.15);
            }
        }

        /* ---- Header ---- */
        .header {
            text-align: center;
            margin-bottom: 1.5rem;
        }

        .header h1 {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 0.25rem;
            color: var(--color-text);
        }

        .header p {
            color: var(--color-text-muted);
            font-size: 0.875rem;
        }

        /* ---- Form ---- */
        .form-group {
            margin-bottom: 1rem;
        }

        .form-group label {
            display: block;
            font-size: 0.875rem;
            font-weight: 500;
            margin-bottom: 0.375rem;
            color: var(--color-text-muted);
        }

        .form-group input[type="text"],
        .form-group input[type="password"] {
            width: 100%;
            padding: 0.625rem 0.75rem;
            font-size: 1rem;
            line-height: 1.5;
            border: 1px solid var(--color-border);
            border-radius: var(--input-radius);
            background-color: var(--color-input-bg);
            color: var(--color-text);
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        .form-group input[type="text"]::placeholder,
        .form-group input[type="password"]::placeholder {
            color: rgba(148, 163, 184, 0.5);
        }

        .form-group input[type="text"]:focus,
        .form-group input[type="password"]:focus {
            outline: none;
            border-color: var(--color-input-focus);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2), 0 0 16px rgba(59, 130, 246, 0.1);
        }

        /* ---- Button ---- */
        .btn-submit {
            display: block;
            width: 100%;
            padding: 0.75rem 1rem;
            font-size: 1rem;
            font-weight: 600;
            color: #FFFFFF;
            background: linear-gradient(135deg, var(--color-primary) 0%, var(--color-primary-hover) 100%);
            border: none;
            border-radius: var(--input-radius);
            cursor: pointer;
            transition: box-shadow 0.2s ease, transform 0.1s ease;
            margin-top: 1.5rem;
            position: relative;
            overflow: hidden;
        }

        .btn-submit::after {
            content: "";
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.15), transparent);
            animation: shimmer 3s ease-in-out infinite;
        }

        @keyframes shimmer {
            0%, 100% { left: -100%; }
            50% { left: 100%; }
        }

        .btn-submit:hover {
            box-shadow: 0 4px 20px rgba(59, 130, 246, 0.4);
            transform: translateY(-1px);
        }

        .btn-submit:active {
            transform: translateY(0);
        }

        .btn-submit:focus-visible {
            outline: 2px solid var(--color-primary);
            outline-offset: 2px;
        }

        /* ---- Footer ---- */
        .footer {
            text-align: center;
            margin-top: 1.5rem;
            font-size: 0.75rem;
            color: var(--color-text-muted);
        }

        /* ---- Alerts ---- */
        .alert {
            padding: 0.75rem 1rem;
            border-radius: var(--input-radius);
            font-size: 0.875rem;
            margin-bottom: 1.5rem;
            border: 1px solid;
        }

        .alert-error {
            background-color: var(--color-error-bg);
            border-color: var(--color-error-border);
            color: var(--color-error);
        }

        .alert-success {
            background-color: var(--color-success-bg);
            border-color: var(--color-success-border);
            color: var(--color-success);
        }

        /* ---- MOTD ---- */
        .motd {
            text-align: center;
            margin-top: 1rem;
            padding: 0.625rem 0.75rem;
            background: rgba(59, 130, 246, 0.06);
            border: 1px solid rgba(59, 130, 246, 0.12);
            border-radius: var(--input-radius);
            font-size: 0.75rem;
            color: var(--color-text-muted);
            font-style: italic;
            min-height: 2.5em;
            transition: opacity 0.4s ease;
        }

        .motd span {
            color: #93C5FD;
        }

        /* ---- System Info Panel ---- */
        .sys-info {
            margin-top: 1.5rem;
            padding-top: 1rem;
            border-top: 1px solid var(--color-border);
        }

        .sys-info-title {
            font-family: "SF Mono", "Cascadia Code", "Fira Code", "Consolas", monospace;
            font-size: 0.6875rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--color-text-muted);
            margin-bottom: 0.625rem;
        }

        .sys-info-grid {
            display: grid;
            grid-template-columns: auto 1fr;
            gap: 0.25rem 0.75rem;
            align-items: baseline;
        }

        .sys-info-label {
            font-family: "SF Mono", "Cascadia Code", "Fira Code", "Consolas", monospace;
            font-size: 0.6875rem;
            color: var(--color-text-muted);
            white-space: nowrap;
        }

        .sys-info-value {
            font-family: "SF Mono", "Cascadia Code", "Fira Code", "Consolas", monospace;
            font-size: 0.6875rem;
            color: #93C5FD;
            word-break: break-word;
        }

        /* ---- Accessibility ---- */
        @media (prefers-reduced-motion: reduce) {
            .logo-wrap::before,
            .card,
            .btn-submit::after {
                animation: none;
            }
            .card {
                opacity: 1;
                transform: none;
            }
        }
    </style>
</head>
<body>
    <canvas id="network-bg" aria-hidden="true"></canvas>

    <div class="card">
        <div class="logo">
            <div class="logo-wrap">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
                    <path d="M8.5 12.5c0-2 1.5-3.5 3.5-3.5s3.5 1.5 3.5 3.5" fill="none"/>
                    <path d="M10 15c0-1.1.9-2 2-2s2 .9 2 2" fill="none"/>
                    <circle cx="12" cy="17" r="0.5" fill="currentColor" stroke="none"/>
                </svg>
            </div>
        </div>

        <div class="header">
            <h1>KumarNet Gast</h1>
            <p id="subtitle">Marcs Internet ist nicht umsonst... achso doch.</p>
        </div>

        <form method="POST" action="$PORTAL_ACTION$">
            <input type="hidden" name="redirurl" value="$PORTAL_REDIRURL$">
            <input type="hidden" name="zone" value="$PORTAL_ZONE$">

            <div class="form-group">
                <label for="auth_user">Wer bist du?</label>
                <input type="text" id="auth_user" name="auth_user" required autocomplete="username" placeholder="Dein Hackername" value="guest">
            </div>

            <div class="form-group">
                <label for="auth_pass">Geheimcode</label>
                <input type="password" id="auth_pass" name="auth_pass" required autofocus autocomplete="current-password" placeholder="Das Passwort ist nicht 'Passwort'">
            </div>

            <button type="submit" name="accept" value="Anmelden" class="btn-submit">Reinlassen bitte</button>
        </form>

        <div class="motd" id="motd"></div>

        <div class="sys-info" id="sys-info">
            <div class="sys-info-title">System Info</div>
            <div class="sys-info-grid" id="sys-info-grid"></div>
        </div>

        <div class="footer">
            &copy; 2026 KumarNet &middot; Powered by Marcs Keller-Rack
        </div>
    </div>

    <script>
    (function () {
        // Rotierende Untertitel
        var subtitles = [
            "Marcs Internet ist nicht umsonst... achso doch.",
            "Bitte nicht das ganze Datenvolumen aufbrauchen.",
            "Schneller als dein mobiles Netz. Wahrscheinlich.",
            "Das WLAN-Passwort steht nicht auf dem Kuehlschrank.",
            "Keine illegalen Downloads. Marc guckt zu.",
            "Bandbreite ist begrenzt. Genau wie Marcs Geduld.",
            "Willkommen im besten Netzwerk der Strasse.",
            "Ja, Marc hat das selbst konfiguriert. Bitte.",
            "5G haben wir nicht. Dafuer Liebe.",
            "Dein eigenes WLAN ist bestimmt nicht so schoen."
        ];
        var subEl = document.getElementById("subtitle");
        var subIdx = 0;
        setInterval(function () {
            subIdx = (subIdx + 1) % subtitles.length;
            subEl.style.opacity = "0";
            setTimeout(function () {
                subEl.textContent = subtitles[subIdx];
                subEl.style.opacity = "1";
            }, 400);
        }, 6000);
        subEl.style.transition = "opacity 0.4s ease";

        // Tipp des Tages / MOTD
        var tips = [
            "Tipp: <span>Das Passwort ist wirklich nicht 'Passwort'.</span>",
            "Fun Fact: <span>Dieses Portal hat mehr CSS als manche Webseiten.</span>",
            "Hinweis: <span>Marc sieht alles. ALLES.</span>",
            "Info: <span>Dieses Netzwerk laeuft auf Kaffeemaschinen-Energie.</span>",
            "Tipp: <span>Bei Problemen: Router aus, Router an, Marc anrufen.</span>",
            "Reminder: <span>Bitte nach der Party das WLAN vergessen.</span>",
            "Warnung: <span>Wer Netflix in 4K streamt, zahlt die Stromrechnung.</span>",
            "Fun Fact: <span>Das Keller-Rack ist lauter als der Kuehlschrank.</span>",
            "Pro-Tipp: <span>Frag Marc nach dem Passwort. Er liebt das.</span>",
            "Achtung: <span>Marc loggt deine Suchanfragen. (Nein, tut er nicht.)</span>",
            "Info: <span>Uptime seit dem letzten Stromausfall: wahrscheinlich lang.</span>",
            "Tipp: <span>Das 5 GHz Netz ist schneller. Aber das weisst du ja.</span>"
        ];
        var motdEl = document.getElementById("motd");
        var tipIdx = Math.floor(Math.random() * tips.length);
        motdEl.innerHTML = tips[tipIdx];
        setInterval(function () {
            tipIdx = (tipIdx + 1) % tips.length;
            motdEl.style.opacity = "0";
            setTimeout(function () {
                motdEl.innerHTML = tips[tipIdx];
                motdEl.style.opacity = "1";
            }, 400);
        }, 8000);
    })();
    </script>

    <script>
    (function () {
        var grid = document.getElementById("sys-info-grid");

        function addRow(label, value) {
            if (!value) return;
            var l = document.createElement("span");
            l.className = "sys-info-label";
            l.textContent = label;
            var v = document.createElement("span");
            v.className = "sys-info-value";
            v.textContent = value;
            grid.appendChild(l);
            grid.appendChild(v);
        }

        function parseUA() {
            var ua = navigator.userAgent;
            var os = "Unbekannt";
            var browser = "Unbekannt";

            if (/Windows NT 10/.test(ua)) os = "Windows 10/11";
            else if (/Windows NT 6\.3/.test(ua)) os = "Windows 8.1";
            else if (/Windows NT 6\.1/.test(ua)) os = "Windows 7";
            else if (/Mac OS X ([\d_]+)/.test(ua)) os = "macOS " + RegExp.$1.replace(/_/g, ".");
            else if (/CrOS/.test(ua)) os = "Chrome OS";
            else if (/Android ([\d.]+)/.test(ua)) os = "Android " + RegExp.$1;
            else if (/iPhone OS ([\d_]+)/.test(ua)) os = "iOS " + RegExp.$1.replace(/_/g, ".");
            else if (/iPad.*OS ([\d_]+)/.test(ua)) os = "iPadOS " + RegExp.$1.replace(/_/g, ".");
            else if (/Linux/.test(ua)) os = "Linux";

            if (/Edg\/([\d.]+)/.test(ua)) browser = "Edge " + RegExp.$1;
            else if (/OPR\/([\d.]+)/.test(ua)) browser = "Opera " + RegExp.$1;
            else if (/Chrome\/([\d.]+)/.test(ua)) browser = "Chrome " + RegExp.$1.split(".")[0];
            else if (/Version\/([\d.]+).*Safari/.test(ua)) browser = "Safari " + RegExp.$1;
            else if (/Firefox\/([\d.]+)/.test(ua)) browser = "Firefox " + RegExp.$1;

            return { os: os, browser: browser };
        }

        // Netzwerk
        var conn = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
        if (conn) {
            var parts = [];
            if (conn.effectiveType) parts.push(conn.effectiveType.toUpperCase());
            if (conn.downlink) parts.push(conn.downlink + " Mbps");
            if (conn.rtt != null) parts.push(conn.rtt + "ms RTT");
            if (parts.length) addRow("Netzwerk", parts.join(" \u00B7 "));
        }

        // Geraet (OS + Browser)
        var info = parseUA();
        addRow("Ger\u00E4t", info.os + " \u00B7 " + info.browser);

        // Display
        var sw = screen.width, sh = screen.height;
        var dprVal = window.devicePixelRatio;
        var displayParts = [sw + " \u00D7 " + sh];
        if (dprVal) displayParts.push(dprVal + "x DPR");
        addRow("Display", displayParts.join(" \u00B7 "));

        // Hardware
        var hwParts = [];
        if (navigator.hardwareConcurrency) hwParts.push(navigator.hardwareConcurrency + " Cores");
        if (navigator.deviceMemory) hwParts.push(navigator.deviceMemory + " GB RAM");
        if (hwParts.length) addRow("Hardware", hwParts.join(" \u00B7 "));

        // Akku (async)
        if (navigator.getBattery) {
            navigator.getBattery().then(function (bat) {
                var level = Math.round(bat.level * 100) + "%";
                var charging = bat.charging ? "Laden" : "Entladen";
                addRow("Akku", level + " \u00B7 " + charging);
            }).catch(function () {});
        }

        // Zeitzone
        try {
            var tz = Intl.DateTimeFormat().resolvedOptions().timeZone;
            if (tz) addRow("Zeitzone", tz);
        } catch (e) {}

        // Sprache
        if (navigator.language) addRow("Sprache", navigator.language);

        // Online-Status
        addRow("Status", navigator.onLine ? "Online" : "Offline");
    })();
    </script>

    <script>
    (function () {
        var c = document.getElementById("network-bg");
        var ctx = c.getContext("2d");
        var pts = [];
        var N, maxD;
        var W = 0, H = 0;
        var dpr = window.devicePixelRatio || 1;
        var pointer = { x: -1000, y: -1000, active: false };
        var pointerRadius = 180;
        var nextFrame = window.requestAnimationFrame
            || window.webkitRequestAnimationFrame
            || function (fn) { return setTimeout(fn, 16); };

        function calcParams() {
            var area = W * H;
            N = Math.max(40, Math.min(100, Math.round(area / 12000)));
            maxD = Math.max(120, Math.min(200, Math.round(Math.min(W, H) * 0.28)));
        }

        function resize() {
            W = window.innerWidth || document.documentElement.clientWidth;
            H = window.innerHeight || document.documentElement.clientHeight;
            c.width = W * dpr;
            c.height = H * dpr;
            c.style.width = W + "px";
            c.style.height = H + "px";
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
            calcParams();
            while (pts.length < N) {
                pts.push({
                    x: Math.random() * W,
                    y: Math.random() * H,
                    vx: (Math.random() - 0.5) * 0.5,
                    vy: (Math.random() - 0.5) * 0.5,
                    r: Math.random() * 2 + 1.5
                });
            }
            if (pts.length > N) pts.length = N;
        }

        function frame() {
            ctx.clearRect(0, 0, W, H);
            var i, j, dx, dy, d, a, p;

            for (i = 0; i < pts.length; i++) {
                for (j = i + 1; j < pts.length; j++) {
                    dx = pts[i].x - pts[j].x;
                    dy = pts[i].y - pts[j].y;
                    d = Math.sqrt(dx * dx + dy * dy);
                    if (d < maxD) {
                        a = 0.25 * (1 - d / maxD);
                        ctx.beginPath();
                        ctx.strokeStyle = "rgba(59,130,246," + a + ")";
                        ctx.lineWidth = 1;
                        ctx.moveTo(pts[i].x, pts[i].y);
                        ctx.lineTo(pts[j].x, pts[j].y);
                        ctx.stroke();
                    }
                }
            }

            if (pointer.active) {
                for (i = 0; i < pts.length; i++) {
                    dx = pts[i].x - pointer.x;
                    dy = pts[i].y - pointer.y;
                    d = Math.sqrt(dx * dx + dy * dy);
                    if (d < pointerRadius) {
                        a = 0.3 * (1 - d / pointerRadius);
                        ctx.beginPath();
                        ctx.strokeStyle = "rgba(96,165,250," + a + ")";
                        ctx.lineWidth = 1.2;
                        ctx.moveTo(pts[i].x, pts[i].y);
                        ctx.lineTo(pointer.x, pointer.y);
                        ctx.stroke();
                    }
                }
            }

            for (i = 0; i < pts.length; i++) {
                p = pts[i];
                var glow = 0;
                if (pointer.active) {
                    dx = p.x - pointer.x;
                    dy = p.y - pointer.y;
                    d = Math.sqrt(dx * dx + dy * dy);
                    if (d < pointerRadius) glow = 1 - d / pointerRadius;
                }
                var baseA = 0.5 + glow * 0.4;
                var r = p.r + glow * 1.5;
                ctx.beginPath();
                ctx.fillStyle = "rgba(59,130,246," + baseA + ")";
                ctx.arc(p.x, p.y, r, 0, 6.2832);
                ctx.fill();
            }

            for (i = 0; i < pts.length; i++) {
                p = pts[i];
                if (pointer.active) {
                    dx = pointer.x - p.x;
                    dy = pointer.y - p.y;
                    d = Math.sqrt(dx * dx + dy * dy);
                    if (d < pointerRadius && d > 1) {
                        var force = 0.02 * (1 - d / pointerRadius);
                        p.vx += (dx / d) * force;
                        p.vy += (dy / d) * force;
                    }
                }
                var speed = Math.sqrt(p.vx * p.vx + p.vy * p.vy);
                if (speed > 1.2) {
                    p.vx *= 0.98;
                    p.vy *= 0.98;
                }
                p.x += p.vx;
                p.y += p.vy;
                if (p.x < 0 || p.x > W) p.vx *= -1;
                if (p.y < 0 || p.y > H) p.vy *= -1;
                p.x = Math.max(0, Math.min(W, p.x));
                p.y = Math.max(0, Math.min(H, p.y));
            }

            nextFrame(frame);
        }

        function onPointer(e) {
            var x, y;
            if (e.touches && e.touches.length > 0) {
                x = e.touches[0].clientX;
                y = e.touches[0].clientY;
            } else {
                x = e.clientX;
                y = e.clientY;
            }
            pointer.x = x;
            pointer.y = y;
            pointer.active = true;
        }

        function onPointerEnd() {
            pointer.active = false;
            pointer.x = -1000;
            pointer.y = -1000;
        }

        resize();
        nextFrame(frame);
        window.addEventListener("resize", function () { dpr = window.devicePixelRatio || 1; resize(); });
        window.addEventListener("mousemove", onPointer);
        window.addEventListener("touchstart", onPointer, { passive: true });
        window.addEventListener("touchmove", onPointer, { passive: true });
        window.addEventListener("touchend", onPointerEnd);
        window.addEventListener("mouseleave", onPointerEnd);
    })();
    </script>
</body>
</html>
