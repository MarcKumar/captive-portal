<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>KumarNet Gast - Anmeldung</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --color-primary: #3B82F6;
            --color-primary-hover: #2563EB;
            --color-primary-glow: rgba(59, 130, 246, 0.4);
            --color-bg-dark: #050a15;
            --color-bg-light: #0c1425;
            --color-card: rgba(255, 255, 255, 0.035);
            --color-card-border: rgba(255, 255, 255, 0.08);
            --color-text: #F1F5F9;
            --color-text-muted: #94A3B8;
            --color-border: rgba(148, 163, 184, 0.15);
            --color-input-bg: rgba(15, 23, 42, 0.6);
            --color-input-focus: #3B82F6;
            --color-error: #F87171;
            --color-error-bg: rgba(248, 113, 113, 0.1);
            --color-error-border: rgba(248, 113, 113, 0.3);
            --color-success: #4ADE80;
            --color-success-bg: rgba(74, 222, 128, 0.1);
            --color-success-border: rgba(74, 222, 128, 0.3);
            --card-max-width: 440px;
            --card-radius: 20px;
            --input-radius: 12px;
            --font-size-h1: clamp(1.375rem, 4vw, 1.625rem);
            --font-size-body: clamp(0.8125rem, 2.5vw, 0.875rem);
            --card-padding-x: clamp(1.5rem, 5vw, 2.25rem);
            --card-padding-y: clamp(2rem, 6vw, 2.75rem);
            --min-touch-target: 44px;
            --card-blur: 24px;
            --transition-fast: 0.15s ease;
            --transition-base: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            --transition-slow: 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background:
                radial-gradient(ellipse at 15% 50%, rgba(59, 130, 246, 0.07) 0%, transparent 50%),
                radial-gradient(ellipse at 85% 20%, rgba(139, 92, 246, 0.05) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 90%, rgba(6, 182, 212, 0.04) 0%, transparent 40%),
                linear-gradient(180deg, #050a15 0%, #0c1425 50%, #050a15 100%);
            color: var(--color-text);
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
            padding: env(safe-area-inset-top, 1rem) env(safe-area-inset-right, 1rem) env(safe-area-inset-bottom, 1rem) env(safe-area-inset-left, 1rem);
            line-height: 1.5;
            overflow-y: auto;
            position: relative;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* ---- Network Canvas Background ---- */
        #network-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        /* ---- Card ---- */
        .card {
            background: var(--color-card);
            backdrop-filter: blur(var(--card-blur)) saturate(1.5);
            -webkit-backdrop-filter: blur(var(--card-blur)) saturate(1.5);
            border: 1px solid var(--color-card-border);
            border-top-color: rgba(255, 255, 255, 0.12);
            border-radius: var(--card-radius);
            box-shadow:
                0 4px 16px rgba(0, 0, 0, 0.3),
                0 16px 56px rgba(0, 0, 0, 0.4),
                0 0 80px -20px rgba(59, 130, 246, 0.06);
            width: 100%;
            max-width: var(--card-max-width);
            padding: var(--card-padding-y) var(--card-padding-x);
            position: relative;
            z-index: 1;
            animation: card-enter 0.7s cubic-bezier(0.16, 1, 0.3, 1) both, card-glow 6s ease-in-out 1s infinite;
        }

        .card::before {
            content: "";
            position: absolute;
            inset: 0;
            border-radius: inherit;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.04) 0%, transparent 40%, rgba(59, 130, 246, 0.02) 100%);
            pointer-events: none;
            z-index: 0;
        }

        /* Inset highlight line at top */
        .card::after {
            content: "";
            position: absolute;
            top: 0;
            left: 10%;
            right: 10%;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.12), transparent);
            border-radius: inherit;
            pointer-events: none;
            z-index: 0;
        }

        @keyframes card-enter {
            from {
                opacity: 0;
                transform: translateY(24px) scale(0.98);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        @keyframes card-glow {
            0%, 100% {
                box-shadow:
                    0 4px 16px rgba(0, 0, 0, 0.3),
                    0 16px 56px rgba(0, 0, 0, 0.4),
                    0 0 80px -20px rgba(59, 130, 246, 0.06);
            }
            50% {
                box-shadow:
                    0 4px 16px rgba(0, 0, 0, 0.3),
                    0 16px 56px rgba(0, 0, 0, 0.4),
                    0 0 100px -20px rgba(59, 130, 246, 0.1),
                    0 0 140px -40px rgba(139, 92, 246, 0.05);
            }
        }

        /* ---- Logo ---- */
        .logo {
            display: flex;
            justify-content: center;
            margin-bottom: 1.5rem;
        }

        .logo-wrap {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .logo-wrap::before {
            content: "";
            position: absolute;
            width: 76px;
            height: 76px;
            border-radius: 50%;
            border: 1.5px solid rgba(59, 130, 246, 0.25);
            animation: pulse-glow 3s ease-in-out infinite;
        }

        .logo-wrap::after {
            content: "";
            position: absolute;
            width: 90px;
            height: 90px;
            border-radius: 50%;
            border: 1px solid rgba(59, 130, 246, 0.12);
            animation: pulse-glow-outer 4s ease-in-out infinite;
        }

        .logo svg {
            width: 56px;
            height: 56px;
            color: var(--color-primary);
            filter: drop-shadow(0 0 8px var(--color-primary-glow));
            position: relative;
            z-index: 1;
        }

        @keyframes pulse-glow {
            0%, 100% {
                transform: scale(1);
                border-color: rgba(59, 130, 246, 0.25);
                box-shadow: 0 0 0 0 rgba(59, 130, 246, 0);
            }
            50% {
                transform: scale(1.08);
                border-color: rgba(59, 130, 246, 0.4);
                box-shadow: 0 0 20px 4px rgba(59, 130, 246, 0.15);
            }
        }

        @keyframes pulse-glow-outer {
            0%, 100% {
                transform: scale(1);
                opacity: 0.5;
            }
            50% {
                transform: scale(1.12);
                opacity: 1;
            }
        }

        /* ---- Header ---- */
        .header {
            text-align: center;
            margin-bottom: 1.5rem;
            position: relative;
            z-index: 1;
        }

        .header h1 {
            font-size: var(--font-size-h1);
            font-weight: 700;
            margin-bottom: 0.25rem;
            letter-spacing: -0.02em;
            background: linear-gradient(135deg, #F8FAFC 0%, #93C5FD 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .header p {
            color: var(--color-text-muted);
            font-size: var(--font-size-body);
        }

        /* ---- Form ---- */
        .form-group {
            margin-bottom: 1rem;
            position: relative;
            z-index: 1;
        }

        .form-group label {
            display: block;
            font-size: var(--font-size-body);
            font-weight: 500;
            margin-bottom: 0.375rem;
            color: var(--color-text-muted);
            transition: color var(--transition-fast);
        }

        .form-group:focus-within label {
            color: #93C5FD;
        }

        .form-group input[type="text"],
        .form-group input[type="password"] {
            width: 100%;
            padding: 0.625rem 0.75rem;
            font-size: 1rem;
            line-height: 1.5;
            min-height: var(--min-touch-target);
            border: 1px solid var(--color-border);
            border-radius: var(--input-radius);
            background-color: var(--color-input-bg);
            color: var(--color-text);
            transition: border-color var(--transition-base), box-shadow var(--transition-base), background-color var(--transition-base);
            touch-action: manipulation;
        }

        .form-group input[type="text"]::placeholder,
        .form-group input[type="password"]::placeholder {
            color: rgba(148, 163, 184, 0.5);
        }

        .form-group input[type="text"]:hover,
        .form-group input[type="password"]:hover {
            border-color: rgba(148, 163, 184, 0.4);
        }

        .form-group input[type="text"]:focus,
        .form-group input[type="password"]:focus {
            outline: none;
            border-color: var(--color-input-focus);
            background-color: rgba(15, 23, 42, 0.8);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15), 0 0 20px rgba(59, 130, 246, 0.08);
        }

        /* ---- Button ---- */
        .btn-submit {
            display: block;
            width: 100%;
            padding: 0.75rem 1rem;
            min-height: var(--min-touch-target);
            font-size: 1rem;
            font-weight: 600;
            color: #FFFFFF;
            background: linear-gradient(135deg, #3B82F6 0%, #6366F1 50%, #8B5CF6 100%);
            border: none;
            border-radius: var(--input-radius);
            cursor: pointer;
            transition: box-shadow var(--transition-base), transform var(--transition-fast), filter var(--transition-fast);
            margin-top: 1.5rem;
            position: relative;
            overflow: hidden;
            touch-action: manipulation;
            letter-spacing: 0.01em;
            z-index: 1;
        }

        .btn-submit::after {
            content: "";
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.15), transparent);
            animation: shimmer 3s ease-in-out infinite;
            z-index: 1;
        }

        @keyframes shimmer {
            0%, 100% { left: -100%; }
            50% { left: 100%; }
        }

        .btn-submit:hover {
            filter: brightness(1.1);
            box-shadow:
                0 4px 16px rgba(59, 130, 246, 0.3),
                0 8px 32px rgba(99, 102, 241, 0.2);
            transform: translateY(-2px);
        }

        .btn-submit:active {
            transform: scale(0.98);
            filter: brightness(0.95);
        }

        .btn-submit:focus-visible {
            outline: none;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.5), 0 0 0 6px rgba(59, 130, 246, 0.2);
        }

        /* ---- Footer ---- */
        .footer {
            text-align: center;
            margin-top: 1.5rem;
            padding-top: 1rem;
            border-top: 1px solid rgba(148, 163, 184, 0.1);
            font-size: 0.6875rem;
            color: var(--color-text-muted);
            opacity: 0.7;
            transition: opacity var(--transition-base);
            letter-spacing: 0.02em;
            position: relative;
            z-index: 1;
        }

        .footer:hover {
            opacity: 1;
        }

        /* ---- Alerts ---- */
        .alert {
            padding: 0.75rem 1rem;
            border-radius: var(--input-radius);
            font-size: var(--font-size-body);
            margin-bottom: 1.5rem;
            border: 1px solid;
            position: relative;
            z-index: 1;
        }

        .alert-error {
            background-color: var(--color-error-bg);
            border-color: var(--color-error-border);
            color: var(--color-error);
        }

        .alert-success {
            background-color: var(--color-success-bg);
            border-color: var(--color-success-border);
            color: var(--color-success);
        }

        /* ---- MOTD ---- */
        .motd {
            display: flex;
            align-items: center;
            justify-content: center;
            margin-top: 1rem;
            padding: 0.625rem 0.75rem;
            background: rgba(59, 130, 246, 0.04);
            border: 1px solid rgba(59, 130, 246, 0.08);
            border-left: 3px solid rgba(59, 130, 246, 0.3);
            border-radius: var(--input-radius);
            font-size: 0.75rem;
            color: var(--color-text-muted);
            font-style: italic;
            min-height: 2.5em;
            transition: opacity var(--transition-slow);
            position: relative;
            z-index: 1;
        }

        .motd span {
            color: #93C5FD;
        }

        /* ---- System Info Panel ---- */
        .sys-info {
            margin-top: 1.5rem;
            padding-top: 1rem;
            border-top: 1px solid var(--color-border);
            position: relative;
            z-index: 1;
        }

        .sys-info-toggle {
            font-family: "SF Mono", "Cascadia Code", "Fira Code", "Consolas", monospace;
            font-size: 0.6875rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--color-text-muted);
            background: none;
            border: none;
            cursor: pointer;
            padding: 0.5rem 0.25rem;
            min-height: var(--min-touch-target);
            display: flex;
            align-items: center;
            gap: 0.375rem;
            transition: color var(--transition-base);
            touch-action: manipulation;
        }

        .sys-info-toggle:hover {
            color: var(--color-text);
        }

        .sys-info-arrow {
            display: inline-block;
            font-size: 0.5rem;
            transition: transform 0.3s ease;
        }

        .sys-info.open .sys-info-arrow {
            transform: rotate(90deg);
        }

        .sys-info-grid {
            display: grid;
            grid-template-columns: auto 1fr;
            gap: 0.25rem 0.75rem;
            align-items: baseline;
            max-height: 0;
            overflow: hidden;
            opacity: 0;
            transition: max-height 0.35s ease, margin-top 0.35s ease, opacity 0.3s ease;
            margin-top: 0;
        }

        .sys-info.open .sys-info-grid {
            max-height: 20rem;
            margin-top: 0.625rem;
            opacity: 1;
        }

        .sys-info-label {
            font-family: "SF Mono", "Cascadia Code", "Fira Code", "Consolas", monospace;
            font-size: 0.6875rem;
            color: var(--color-text-muted);
            white-space: nowrap;
        }

        .sys-info-value {
            font-family: "SF Mono", "Cascadia Code", "Fira Code", "Consolas", monospace;
            font-size: 0.6875rem;
            color: #93C5FD;
            word-break: break-word;
        }

        /* ---- Responsive Breakpoints ---- */
        @media (max-width: 480px) {
            :root {
                --card-padding-x: 1.25rem;
                --card-padding-y: 1.5rem;
            }
        }

        @media (max-width: 380px) {
            :root {
                --card-radius: 14px;
                --input-radius: 10px;
                --card-padding-x: 1rem;
                --card-padding-y: 1.25rem;
            }
            .logo svg { width: 44px; height: 44px; }
            .logo-wrap::before { width: 60px; height: 60px; }
            .logo-wrap::after { width: 72px; height: 72px; }
        }

        /* Compact for mobile portrait */
        @media (max-height: 740px) {
            body { padding: 0.5rem; }
            .logo { margin-bottom: 0.75rem; }
            .logo svg { width: 40px; height: 40px; }
            .logo-wrap::before { width: 56px; height: 56px; }
            .logo-wrap::after { width: 68px; height: 68px; }
            .header { margin-bottom: 0.75rem; }
            .header p { font-size: 0.75rem; }
            .form-group { margin-bottom: 0.625rem; }
            .form-group label { margin-bottom: 0.25rem; }
            .form-group input[type="text"],
            .form-group input[type="password"] {
                padding: 0.5rem 0.75rem;
                min-height: 40px;
            }
            .btn-submit { margin-top: 0.75rem; min-height: 40px; padding: 0.625rem 1rem; }
            .motd { margin-top: 0.5rem; padding: 0.5rem 0.625rem; font-size: 0.6875rem; min-height: auto; }
            .sys-info { margin-top: 0.75rem; padding-top: 0.5rem; }
            .sys-info-toggle { min-height: 36px; padding: 0.25rem; }
            .footer { margin-top: 0.75rem; padding-top: 0.5rem; }
        }

        /* Very compact for small screens */
        @media (max-height: 600px) {
            :root {
                --card-padding-y: 1rem;
                --card-padding-x: 1rem;
            }
            body { padding: 0.25rem; }
            .logo { margin-bottom: 0.5rem; }
            .logo svg { width: 32px; height: 32px; }
            .logo-wrap::before { width: 46px; height: 46px; }
            .logo-wrap::after { width: 56px; height: 56px; }
            .header { margin-bottom: 0.5rem; }
            .form-group { margin-bottom: 0.5rem; }
            .form-group input[type="text"],
            .form-group input[type="password"] {
                padding: 0.375rem 0.625rem;
                min-height: 38px;
                font-size: 0.9375rem;
            }
            .btn-submit { margin-top: 0.5rem; min-height: 38px; padding: 0.5rem; font-size: 0.9375rem; }
            .motd { margin-top: 0.375rem; padding: 0.375rem 0.5rem; font-size: 0.625rem; }
            .sys-info { margin-top: 0.5rem; padding-top: 0.375rem; }
            .footer { margin-top: 0.5rem; padding-top: 0.375rem; font-size: 0.625rem; }
        }

        /* Landscape mode */
        @media (max-height: 500px) and (orientation: landscape) {
            .card { padding: 0.75rem 1rem; }
            .logo { margin-bottom: 0.375rem; }
            .logo svg { width: 28px; height: 28px; }
            .logo-wrap::before { width: 40px; height: 40px; }
            .logo-wrap::after { width: 48px; height: 48px; }
            .header { margin-bottom: 0.375rem; }
            .form-group { margin-bottom: 0.375rem; }
            .btn-submit { margin-top: 0.375rem; }
            .motd { margin-top: 0.25rem; }
            .sys-info { margin-top: 0.25rem; padding-top: 0.25rem; }
            .footer { margin-top: 0.25rem; padding-top: 0.25rem; }
        }

        @media (min-width: 768px) {
            :root { --card-max-width: 460px; }
        }

        @media (min-width: 1200px) {
            :root { --card-max-width: 480px; }
        }

        /* ---- Mobile: Card entfernen, Fullscreen-Animation ---- */
        @media (max-width: 767px) {
            .card {
                background: none;
                backdrop-filter: none;
                -webkit-backdrop-filter: none;
                border: none;
                box-shadow: none;
                border-radius: 0;
                animation: none;
                max-width: 100%;
                opacity: 1;
                transform: none;
            }
            .card::before,
            .card::after {
                display: none;
            }
            body {
                padding: 0.75rem 1.25rem;
            }
            .header h1,
            .header p,
            .form-group label,
            .footer {
                text-shadow: 0 1px 3px rgba(0,0,0,0.8);
            }
            .footer {
                border-top: none;
            }
            .logo-wrap::before {
                opacity: 0.6;
            }
            .logo-wrap::after {
                opacity: 0.5;
            }
            .form-group input[type="text"],
            .form-group input[type="password"] {
                background-color: rgba(15, 23, 42, 0.7);
            }
            .motd {
                background: rgba(59, 130, 246, 0.08);
                border-color: rgba(59, 130, 246, 0.15);
            }
            .sys-info {
                border-top: none;
                background: rgba(15, 23, 42, 0.4);
                border-radius: var(--input-radius);
                padding: 0.5rem 0.75rem;
            }
        }

        /* ---- Accessibility ---- */
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
            .card {
                opacity: 1;
                transform: none;
                animation: none !important;
            }
            #network-bg {
                display: none;
            }
        }
    </style>
</head>
<body>
    <canvas id="network-bg" aria-hidden="true"></canvas>

    <div class="card">
        <div class="logo">
            <div class="logo-wrap">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
                    <path d="M8.5 12.5c0-2 1.5-3.5 3.5-3.5s3.5 1.5 3.5 3.5" fill="none"/>
                    <path d="M10 15c0-1.1.9-2 2-2s2 .9 2 2" fill="none"/>
                    <circle cx="12" cy="17" r="0.5" fill="currentColor" stroke="none"/>
                </svg>
            </div>
        </div>

        <div class="header">
            <h1>KumarNet Gast</h1>
            <p id="subtitle">Marcs Internet ist nicht umsonst... achso doch.</p>
        </div>

        <form method="POST" action="$PORTAL_ACTION$">
            <input type="hidden" name="redirurl" value="$PORTAL_REDIRURL$">
            <input type="hidden" name="zone" value="$PORTAL_ZONE$">

            <div class="form-group">
                <label for="auth_user">Wer bist du?</label>
                <input type="text" id="auth_user" name="auth_user" required autocomplete="username" placeholder="Dein Hackername" value="guest">
            </div>

            <div class="form-group">
                <label for="auth_pass">Geheimcode</label>
                <input type="password" id="auth_pass" name="auth_pass" required autofocus autocomplete="current-password" placeholder="Das Passwort ist nicht 'Passwort'">
            </div>

            <button type="submit" name="accept" value="Anmelden" class="btn-submit">Reinlassen bitte</button>
        </form>

        <div class="motd" id="motd"></div>

        <div class="sys-info" id="sys-info">
            <button class="sys-info-toggle" id="sys-info-toggle" type="button">
                <span class="sys-info-arrow">&#9654;</span> System Info
            </button>
            <div class="sys-info-grid" id="sys-info-grid"></div>
        </div>

        <div class="footer">
            &copy; 2026 KumarNet &middot; Powered by Marcs Keller-Rack
        </div>
    </div>

    <script>
    (function () {
        // Rotierende Untertitel
        var subtitles = [
            "Marcs Internet ist nicht umsonst... achso doch.",
            "Bitte nicht das ganze Datenvolumen aufbrauchen.",
            "Schneller als dein mobiles Netz. Wahrscheinlich.",
            "Das WLAN-Passwort steht nicht auf dem Kuehlschrank.",

    <script>
    (function () {
        var grid = document.getElementById("sys-info-grid");

        function addRow(label, value) {
            if (!value) return;
            var l = document.createElement("span");
            l.className = "sys-info-label";
            l.textContent = label;
            var v = document.createElement("span");
            v.className = "sys-info-value";
            v.textContent = value;
            grid.appendChild(l);
            grid.appendChild(v);
        }

        function parseUA() {
            var ua = navigator.userAgent;
            var os = "Unbekannt";
            var browser = "Unbekannt";

            if (/Windows NT 10/.test(ua)) os = "Windows 10/11";
            else if (/Windows NT 6\.3/.test(ua)) os = "Windows 8.1";
            else if (/Windows NT 6\.1/.test(ua)) os = "Windows 7";
            else if (/Mac OS X ([\d_]+)/.test(ua)) os = "macOS " + RegExp.$1.replace(/_/g, ".");
            else if (/CrOS/.test(ua)) os = "Chrome OS";
            else if (/Android ([\d.]+)/.test(ua)) os = "Android " + RegExp.$1;
            else if (/iPhone OS ([\d_]+)/.test(ua)) os = "iOS " + RegExp.$1.replace(/_/g, ".");
            else if (/iPad.*OS ([\d_]+)/.test(ua)) os = "iPadOS " + RegExp.$1.replace(/_/g, ".");
            else if (/Linux/.test(ua)) os = "Linux";

            if (/Edg\/([\d.]+)/.test(ua)) browser = "Edge " + RegExp.$1;
            else if (/OPR\/([\d.]+)/.test(ua)) browser = "Opera " + RegExp.$1;
            else if (/Chrome\/([\d.]+)/.test(ua)) browser = "Chrome " + RegExp.$1.split(".")[0];
            else if (/Version\/([\d.]+).*Safari/.test(ua)) browser = "Safari " + RegExp.$1;
            else if (/Firefox\/([\d.]+)/.test(ua)) browser = "Firefox " + RegExp.$1;

            return { os: os, browser: browser };
        }

        // Netzwerk
        var conn = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
        if (conn) {
            var parts = [];
            if (conn.effectiveType) parts.push(conn.effectiveType.toUpperCase());
            if (conn.downlink) parts.push(conn.downlink + " Mbps");
            if (conn.rtt != null) parts.push(conn.rtt + "ms RTT");
            if (parts.length) addRow("Netzwerk", parts.join(" \u00B7 "));
        }

        // Geraet (OS + Browser)
        var info = parseUA();
        addRow("Ger\u00E4t", info.os + " \u00B7 " + info.browser);

        // Display
        var sw = screen.width, sh = screen.height;
        var dprVal = window.devicePixelRatio;
        var displayParts = [sw + " \u00D7 " + sh];
        if (dprVal) displayParts.push(dprVal + "x DPR");
        addRow("Display", displayParts.join(" \u00B7 "));

        // Hardware
        var hwParts = [];
        if (navigator.hardwareConcurrency) hwParts.push(navigator.hardwareConcurrency + " Cores");
        if (navigator.deviceMemory) hwParts.push(navigator.deviceMemory + " GB RAM");
        if (hwParts.length) addRow("Hardware", hwParts.join(" \u00B7 "));

        // Akku (async)
        if (navigator.getBattery) {
            navigator.getBattery().then(function (bat) {
                var level = Math.round(bat.level * 100) + "%";
                var charging = bat.charging ? "Laden" : "Entladen";
                addRow("Akku", level + " \u00B7 " + charging);
            }).catch(function () {});
        }

        // Zeitzone
        try {
            var tz = Intl.DateTimeFormat().resolvedOptions().timeZone;
            if (tz) addRow("Zeitzone", tz);
        } catch (e) {}

        // Sprache
        if (navigator.language) addRow("Sprache", navigator.language);

        // Online-Status
        addRow("Status", navigator.onLine ? "Online" : "Offline");

        // Toggle
        document.getElementById("sys-info-toggle").addEventListener("click", function () {
            document.getElementById("sys-info").classList.toggle("open");
        });
    })();
    </script>

    <script>
    (function () {
        var c = document.getElementById("network-bg");
        var ctx = c.getContext("2d");
        var pts = [];
        var N, maxD;
        var W = 0, H = 0;
        var dpr = window.devicePixelRatio || 1;
        var isMobile = window.innerWidth < 768;
        var pointer = { x: -1000, y: -1000, active: false };
        var pointerRadius = 200;
        var time = 0;
        var nextFrame = window.requestAnimationFrame
            || window.webkitRequestAnimationFrame
            || function (fn) { return setTimeout(fn, 16); };

        var colors = [
            [59, 130, 246],
            [99, 102, 241],
            [139, 92, 246],
            [6, 182, 212]
        ];

        function pickColor() {
            return colors[Math.floor(Math.random() * colors.length)];
        }

        function calcParams() {
            var area = W * H;
            if (isMobile) {
                N = Math.max(30, Math.min(60, Math.round(area / 15000)));
                maxD = Math.max(110, Math.min(170, Math.round(Math.min(W, H) * 0.24)));
            } else {
                N = Math.max(50, Math.min(120, Math.round(area / 10000)));
                maxD = Math.max(130, Math.min(220, Math.round(Math.min(W, H) * 0.3)));
            }
        }

        function makeParticle() {
            var col = pickColor();
            var bright = Math.random() < 0.15;
            return {
                x: Math.random() * W,
                y: Math.random() * H,
                vx: (Math.random() - 0.5) * 0.35,
                vy: (Math.random() - 0.5) * 0.35,
                r: bright ? (Math.random() * 1.5 + 2.5) : (Math.random() * 1.2 + 1),
                col: col,
                bright: bright,
                phase: Math.random() * Math.PI * 2
            };
        }

        function resize() {
            W = window.innerWidth || document.documentElement.clientWidth;
            H = window.innerHeight || document.documentElement.clientHeight;
            isMobile = W < 768;
            c.width = W * dpr;
            c.height = H * dpr;
            c.style.width = W + "px";
            c.style.height = H + "px";
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
            calcParams();
            while (pts.length < N) pts.push(makeParticle());
            if (pts.length > N) pts.length = N;
        }

        function frame() {
            ctx.clearRect(0, 0, W, H);
            time += 0.006;
            var i, j, dx, dy, d, a, p;

            for (i = 0; i < pts.length; i++) {
                for (j = i + 1; j < pts.length; j++) {
                    dx = pts[i].x - pts[j].x;
                    dy = pts[i].y - pts[j].y;
                    d = Math.sqrt(dx * dx + dy * dy);
                    if (d < maxD) {
                        a = 0.15 * (1 - d / maxD);
                        var mx = (pts[i].col[0] + pts[j].col[0]) >> 1;
                        var my = (pts[i].col[1] + pts[j].col[1]) >> 1;
                        var mz = (pts[i].col[2] + pts[j].col[2]) >> 1;
                        ctx.beginPath();
                        ctx.strokeStyle = "rgba(" + mx + "," + my + "," + mz + "," + a + ")";
                        ctx.lineWidth = 0.7;
                        ctx.moveTo(pts[i].x, pts[i].y);
                        ctx.lineTo(pts[j].x, pts[j].y);
                        ctx.stroke();
                    }
                }
            }

            if (pointer.active) {
                for (i = 0; i < pts.length; i++) {
                    dx = pts[i].x - pointer.x;
                    dy = pts[i].y - pointer.y;
                    d = Math.sqrt(dx * dx + dy * dy);
                    if (d < pointerRadius) {
                        a = 0.25 * (1 - d / pointerRadius);
                        ctx.beginPath();
                        ctx.strokeStyle = "rgba(" + pts[i].col[0] + "," + pts[i].col[1] + "," + pts[i].col[2] + "," + a + ")";
                        ctx.lineWidth = 1;
                        ctx.moveTo(pts[i].x, pts[i].y);
                        ctx.lineTo(pointer.x, pointer.y);
                        ctx.stroke();
                    }
                }
            }

            for (i = 0; i < pts.length; i++) {
                p = pts[i];
                var pulse = 0.45 + 0.25 * Math.sin(time * 2.5 + p.phase);
                var glow = 0;
                if (pointer.active) {
                    dx = p.x - pointer.x;
                    dy = p.y - pointer.y;
                    d = Math.sqrt(dx * dx + dy * dy);
                    if (d < pointerRadius) glow = 1 - d / pointerRadius;
                }
                var baseA = pulse + glow * 0.4;
                var r = p.r + glow * 2;

                if (p.bright) {
                    ctx.beginPath();
                    var grad = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, r * 4);
                    grad.addColorStop(0, "rgba(" + p.col[0] + "," + p.col[1] + "," + p.col[2] + "," + (baseA * 0.12) + ")");
                    grad.addColorStop(1, "rgba(" + p.col[0] + "," + p.col[1] + "," + p.col[2] + ",0)");
                    ctx.fillStyle = grad;
                    ctx.arc(p.x, p.y, r * 4, 0, 6.2832);
                    ctx.fill();
                }

                ctx.beginPath();
                ctx.fillStyle = "rgba(" + p.col[0] + "," + p.col[1] + "," + p.col[2] + "," + baseA + ")";
                ctx.arc(p.x, p.y, r, 0, 6.2832);
                ctx.fill();
            }

            for (i = 0; i < pts.length; i++) {
                p = pts[i];
                if (pointer.active) {
                    dx = pointer.x - p.x;
                    dy = pointer.y - p.y;
                    d = Math.sqrt(dx * dx + dy * dy);
                    if (d < pointerRadius && d > 1) {
                        var force = 0.015 * (1 - d / pointerRadius);
                        p.vx += (dx / d) * force;
                        p.vy += (dy / d) * force;
                    }
                }
                var speed = Math.sqrt(p.vx * p.vx + p.vy * p.vy);
                if (speed > 0.8) {
                    p.vx *= 0.97;
                    p.vy *= 0.97;
                }
                p.x += p.vx;
                p.y += p.vy;
                if (p.x < 0 || p.x > W) p.vx *= -1;
                if (p.y < 0 || p.y > H) p.vy *= -1;
                p.x = Math.max(0, Math.min(W, p.x));
                p.y = Math.max(0, Math.min(H, p.y));
            }

            nextFrame(frame);
        }

        function onPointer(e) {
            var x, y;
            if (e.touches && e.touches.length > 0) {
                x = e.touches[0].clientX;
                y = e.touches[0].clientY;
            } else {
                x = e.clientX;
                y = e.clientY;
            }
            pointer.x = x;
            pointer.y = y;
            pointer.active = true;
        }

        function onPointerEnd() {
            pointer.active = false;
            pointer.x = -1000;
            pointer.y = -1000;
        }

        resize();
        nextFrame(frame);
        window.addEventListener("resize", function () { dpr = window.devicePixelRatio || 1; resize(); });
        window.addEventListener("mousemove", onPointer);
        window.addEventListener("touchstart", onPointer, { passive: true });
        window.addEventListener("touchmove", onPointer, { passive: true });
        window.addEventListener("touchend", onPointerEnd);
        window.addEventListener("mouseleave", onPointerEnd);
    })();
    </script>
